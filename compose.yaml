services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: smartqueue
      POSTGRES_PASSWORD: smartqueue
      POSTGRES_DB: smartqueue
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - queue-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartqueue"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  queue-data:
